<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lime Rider — One-Shot Dirtbike</title>
<style>
  :root {
    --lime: #9EFF1A;
    --lime-2: #7CFC00;
    --ink: #0c0f0a;
    --ink-2: #1a2014;
    --paper: #f4f7ec;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: var(--paper); font-family: 'Trebuchet MS', system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: optimizeQuality; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .overlay.active { pointer-events: auto; }
  .panel { background: rgba(12,15,10,.92); border: 2px solid rgba(158,255,26,.25); border-radius: 18px; padding: 28px 32px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
  .panel h1 { margin: 0 0 8px; font-size: 56px; letter-spacing: 1px; color: var(--lime); text-shadow: 0 4px 20px rgba(158,255,26,.4); font-weight: 900; }
  .panel h2 { margin: 0 0 18px; font-size: 22px; color: #d8e6b8; font-weight: 600; letter-spacing: .5px; }
  .panel p { margin: 6px 0; color: #c5d3a3; font-size: 14px; line-height: 1.5; }
  .btn { display: inline-block; background: var(--lime); color: #0c0f0a; border: none; padding: 14px 28px; margin: 6px 8px; font-size: 16px; font-weight: 800; letter-spacing: 1px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #5cb800, 0 8px 18px rgba(0,0,0,.4); transition: transform .08s ease, box-shadow .08s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5cb800, 0 4px 10px rgba(0,0,0,.4); }
  .btn.ghost { background: transparent; color: var(--lime); border: 2px solid var(--lime); box-shadow: none; }
  .btn.ghost:hover { background: rgba(158,255,26,.1); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .keycap { display: inline-block; min-width: 26px; padding: 3px 8px; background: #2a3320; color: var(--lime); border: 1px solid #4a5a36; border-radius: 6px; font-family: monospace; font-size: 12px; text-align: center; }
  .cheat { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: #c5d3a3; }
  .cheat span { display: inline-flex; align-items: center; gap: 6px; }
  #title, #mapSelect, #pause, #finished { display: none; }
  #title.active, #mapSelect.active, #pause.active, #finished.active { display: flex; }
  #countdown { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 240px; font-weight: 900; color: var(--lime); text-shadow: 0 8px 40px rgba(0,0,0,.7), 0 0 80px rgba(158,255,26,.6); pointer-events: none; z-index: 5; }
  #countdown.active { display: flex; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; font-family: 'Trebuchet MS', monospace; }
  #hud > div { position: absolute; }
  .hud-speed { top: 16px; left: 18px; color: var(--paper); }
  .hud-speed .num { font-size: 56px; font-weight: 900; line-height: 1; color: var(--lime); text-shadow: 0 0 20px rgba(158,255,26,.5); font-variant-numeric: tabular-nums; }
  .hud-speed .unit { font-size: 16px; color: #b9c89a; letter-spacing: 1px; margin-left: 4px; }
  .hud-speed .time { font-size: 22px; color: #fff; margin-top: 4px; font-variant-numeric: tabular-nums; opacity: .92; }
  .hud-mini { top: 16px; right: 18px; width: 140px; text-align: right; }
  .hud-mini .biome { font-size: 12px; letter-spacing: 2px; color: #b9c89a; text-transform: uppercase; margin-bottom: 6px; }
  .hud-mini canvas { display: block; margin-left: auto; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; }
  .hud-bottom { bottom: 14px; left: 18px; font-size: 13px; color: #c5d3a3; }
  .hud-bottom .keycap { margin: 0 2px; }
  .hud-progress { top: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,.5); }
  .hud-progress .bar { height: 100%; background: linear-gradient(90deg, var(--lime), #fff); width: 0%; transition: width .1s linear; }
  .touch { position: fixed; bottom: 18px; right: 18px; display: none; gap: 10px; z-index: 4; }
  .touch .pad { display: grid; grid-template-columns: 56px 56px; grid-template-rows: 56px 56px; gap: 8px; }
  .touch .btn-t { width: 56px; height: 56px; border-radius: 14px; background: rgba(12,15,10,.65); border: 2px solid rgba(158,255,26,.4); color: var(--lime); font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .touch .btn-t:active { background: rgba(158,255,26,.5); color: #0c0f0a; }
  .touch .gas { grid-column: 2; grid-row: 2; background: rgba(158,255,26,.25); }
  .touch .brake { grid-column: 1; grid-row: 2; }
  .touch .lean-l { grid-column: 1; grid-row: 1; }
  .touch .lean-r { grid-column: 2; grid-row: 1; }
  .touch .hand { width: 100%; margin-top: 10px; }
  body.touch .touch { display: grid; }
  body.touch .hud-bottom { display: none; }
  .carousel { position: relative; width: min(960px, 92vw); height: 360px; }
  .carousel .track { display: flex; gap: 22px; height: 100%; align-items: center; justify-content: center; transition: transform .35s cubic-bezier(.22,.61,.36,1); }
  .card { width: 240px; height: 320px; flex-shrink: 0; background: rgba(20,28,16,.92); border: 2px solid rgba(158,255,26,.2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; cursor: pointer; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card.focus { transform: scale(1.06) translateY(-4px); border-color: var(--lime); box-shadow: 0 14px 40px rgba(0,0,0,.5), 0 0 30px rgba(158,255,26,.3); }
  .card canvas { width: 100%; height: 140px; background: #000; border-radius: 8px; display: block; }
  .card .name { font-size: 20px; font-weight: 800; color: var(--lime); margin: 10px 0 4px; letter-spacing: 1px; }
  .card .stars { color: var(--lime); font-size: 14px; letter-spacing: 2px; }
  .card .best { font-size: 12px; color: #b9c89a; margin-top: auto; font-variant-numeric: tabular-nums; }
  .card .desc { font-size: 12px; color: #a8b88a; margin-top: 6px; line-height: 1.4; }
  .carousel .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(158,255,26,.15); border: 2px solid var(--lime); color: var(--lime); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .carousel .nav.prev { left: -22px; }
  .carousel .nav.next { right: -22px; }
  .finish-banner { text-align: center; }
  .finish-banner .big { font-size: 64px; color: var(--lime); font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 30px rgba(158,255,26,.5); margin: 0; }
  .finish-banner .t { font-size: 38px; color: #fff; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .finish-banner .pb { font-size: 18px; color: #b9c89a; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
  .finish-banner .pb.improved { color: var(--lime); }
  .map-hdr { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .map-hdr .back { background: transparent; border: 2px solid var(--lime); color: var(--lime); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; }
  .map-hdr h1 { font-size: 36px; margin: 0; }
  .logo-big { font-size: 72px; font-weight: 900; color: var(--lime); letter-spacing: 3px; text-shadow: 0 6px 30px rgba(158,255,26,.4); margin: 0 0 4px; line-height: 1; }
  .logo-sub { font-size: 18px; color: #b9c89a; letter-spacing: 6px; margin: 0 0 24px; text-transform: uppercase; }
  @media (max-width: 720px) {
    .panel h1 { font-size: 40px; }
    .panel h2 { font-size: 18px; }
    .logo-big { font-size: 52px; }
    .card { width: 200px; height: 280px; }
    #countdown { font-size: 160px; }
    .hud-speed .num { font-size: 38px; }
  }
</style>
<style id="mobile-fix">
/* --- mobile responsiveness fixes (added by the game launcher audit) --- */
html,body{max-width:100%;overflow-x:hidden;}
canvas{max-width:100%!important;max-height:100vh!important;}
#game{width:100%!important;height:auto!important;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" style="display:none">
  <div class="hud-progress"><div class="bar"></div></div>
  <div class="hud-speed">
    <div><span class="num">0</span><span class="unit">KM/H</span></div>
    <div class="time">0:00.00</div>
  </div>
  <div class="hud-mini">
    <div class="biome">—</div>
    <canvas width="120" height="120"></canvas>
  </div>
  <div class="hud-bottom">
    <span class="keycap">R</span> restart &nbsp; <span class="keycap">M</span> menu &nbsp; <span class="keycap">ESC</span> pause
  </div>
</div>

<div class="touch">
  <div>
    <div class="pad">
      <div class="btn-t lean-l" data-k="A">A</div>
      <div class="btn-t lean-r" data-k="D">D</div>
      <div class="btn-t brake" data-k="S">S</div>
      <div class="btn-t gas" data-k="W">W</div>
    </div>
    <div class="btn-t hand" data-k=" ">HB</div>
  </div>
</div>

<div id="title" class="overlay active">
  <div class="panel" style="text-align:center; max-width: 540px;">
    <h1 class="logo-big">LIME RIDER</h1>
    <p class="logo-sub">One-Shot Dirtbike</p>
    <p>Pick a biome. Drop in. Ride the trail.</p>
    <p style="margin: 14px 0 18px">
      <span class="keycap">W</span><span class="keycap">↑</span> gas
      <span class="keycap">S</span><span class="keycap">↓</span> brake
      <span class="keycap">A</span><span class="keycap">D</span> lean
      <span class="keycap">SPACE</span> handbrake
    </p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="btnPlay">PLAY</button>
      <button class="btn ghost" id="btnMaps">MAPS</button>
    </div>
  </div>
</div>

<div id="mapSelect" class="overlay">
  <div class="panel" style="max-width: 1040px;">
    <div class="map-hdr">
      <button class="back" id="btnBack" title="Back">←</button>
      <h1 style="color:var(--lime); margin:0">PICK YOUR TRAIL</h1>
    </div>
    <div class="carousel">
      <button class="nav prev" id="navPrev">‹</button>
      <div class="track" id="carouselTrack"></div>
      <button class="nav next" id="navNext">›</button>
    </div>
    <p style="text-align:center; margin: 16px 0 0; font-size: 12px;">
      <span class="keycap">←</span><span class="keycap">→</span> browse
      <span class="keycap">ENTER</span> start
      <span class="keycap">ESC</span> back
    </p>
  </div>
</div>

<div id="countdown">3</div>

<div id="pause" class="overlay">
  <div class="panel" style="text-align:center; min-width: 320px;">
    <h2>PAUSED</h2>
    <div class="row" style="justify-content:center">
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn ghost" id="btnRestart">RESTART</button>
      <button class="btn ghost" id="btnQuit">QUIT</button>
    </div>
  </div>
</div>

<div id="finished" class="overlay">
  <div class="panel finish-banner">
    <p class="big">FINISHED!</p>
    <p class="t" id="finTime">0:00.00</p>
    <p class="pb" id="finPB">—</p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn ghost" id="btnChangeMap">CHANGE MAP</button>
      <button class="btn ghost" id="btnTitle">TITLE</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
//  RNG — Mulberry32
// ============================================================
function mulberry32(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ============================================================
//  Math utils
// ============================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (rng, a, b) => a + (b - a) * rng();
const choose = (rng, arr) => arr[Math.floor(rng() * arr.length)];
// Shade a hex color by a factor (0=black, 1=unchanged, >1=brighter)
function shadeColor(hex, factor) {
  // Parse #rrggbb
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const nr = clamp(Math.round(r * factor), 0, 255);
  const ng = clamp(Math.round(g * factor), 0, 255);
  const nb = clamp(Math.round(b * factor), 0, 255);
  return '#' + nr.toString(16).padStart(2, '0') + ng.toString(16).padStart(2, '0') + nb.toString(16).padStart(2, '0');
}
function noise1d(x, seed) {
  // Value noise with smooth interpolation
  const xi = Math.floor(x), xf = x - xi;
  const h = (n) => {
    let s = (seed + n * 374761393) >>> 0;
    s = (s ^ (s >>> 13)) * 1274126177 >>> 0;
    return ((s ^ (s >>> 16)) >>> 0) / 4294967296;
  };
  const a = h(xi), b = h(xi + 1);
  const t = xf * xf * (3 - 2 * xf);
  return a + (b - a) * t;
}
function fbm(x, oct, seed) {
  let v = 0, amp = 1, freq = 1, norm = 0;
  for (let i = 0; i < oct; i++) { v += noise1d(x * freq, seed + i * 131) * amp; norm += amp; amp *= 0.5; freq *= 2; }
  return v / norm;
}

// ============================================================
//  Input
// ============================================================
const input = {
  gas: false, brake: false, leanL: false, leanR: false, hand: false,
  pause: false, enter: false, back: false, left: false, right: false, up: false, down: false,
  reset: false, menu: false
};
const KEYMAP = {
  'KeyW': 'gas', 'ArrowUp': 'gas',
  'KeyS': 'brake', 'ArrowDown': 'brake',
  'KeyA': 'leanL', 'ArrowLeft': 'leanL',
  'KeyD': 'leanR', 'ArrowRight': 'leanR',
  'Space': 'hand',
  'KeyR': 'reset',
  'KeyM': 'menu'
};
const KEYMAP_PASSTHROUGH = {
  'Enter': 'enter', 'Escape': 'pause', 'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down'
};
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (KEYMAP_PASSTHROUGH[e.code]) { input[KEYMAP_PASSTHROUGH[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Escape') input.pause = true;
  if (e.code === 'Enter') input.enter = true;
  if (e.code === 'ArrowLeft') input.left = true;
  if (e.code === 'ArrowRight') input.right = true;
  if (e.code === 'ArrowUp') input.up = true;
  if (e.code === 'ArrowDown') input.down = true;
});
window.addEventListener('keyup', e => {
  if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = false; e.preventDefault(); }
  if (KEYMAP_PASSTHROUGH[e.code]) { input[KEYMAP_PASSTHROUGH[e.code]] = false; e.preventDefault(); }
});
// Touch / on-screen buttons
function bindTouch() {
  document.querySelectorAll('.btn-t').forEach(el => {
    const k = el.dataset.k;
    el.addEventListener('touchstart', e => { e.preventDefault(); setKey(k, true); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); setKey(k, false); }, { passive: false });
    el.addEventListener('touchcancel', e => { setKey(k, false); });
  });
}
function setKey(k, val) {
  if (k === 'W') input.gas = val;
  else if (k === 'S') input.brake = val;
  else if (k === 'A') input.leanL = val;
  else if (k === 'D') input.leanR = val;
  else if (k === ' ') input.hand = val;
}
// Detect touch device
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
  document.body.classList.add('touch');
}
bindTouch();

// ============================================================
//  Audio — Web Audio API synthesised SFX
// ============================================================
let audioCtx = null;
let masterGain = null;
let ambientNodes = [];
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);
  } catch (e) { audioCtx = null; }
}
function sfx(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(masterGain);
  g.gain.setValueAtTime(0, t);
  if (type === 'throttle') {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.2);
    o.connect(g); o.start(t); o.stop(t + 0.2);
  } else if (type === 'brake') {
    const o = audioCtx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(110, t + 0.1);
    g.gain.linearRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); o.start(t); o.stop(t + 0.15);
  } else if (type === 'mud') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    g.gain.linearRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    s.connect(f); f.connect(g); s.start(t);
  } else if (type === 'jump') {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(800, t + 0.2);
    g.gain.linearRampToValueAtTime(0.1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); o.start(t); o.stop(t + 0.3);
  } else if (type === 'finish') {
    [523, 659, 784, 1046].forEach((f, i) => {
      const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const gg = audioCtx.createGain();
      gg.gain.setValueAtTime(0, t + i * 0.12);
      gg.gain.linearRampToValueAtTime(0.18, t + i * 0.12 + 0.02);
      gg.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.3);
      o.connect(gg); gg.connect(masterGain);
      o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.35);
    });
  } else if (type === 'count') {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
    g.gain.linearRampToValueAtTime(0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); o.start(t); o.stop(t + 0.2);
  } else if (type === 'go') {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = 1320;
    g.gain.linearRampToValueAtTime(0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); o.start(t); o.stop(t + 0.4);
  }
}
function startAmbient(biome) {
  stopAmbient();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (biome === 'rainforest') {
    // low wind hum
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 50;
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
    const g = audioCtx.createGain(); g.gain.value = 0.04;
    o.connect(f); f.connect(g); g.connect(masterGain); o.start(t);
    ambientNodes.push(o, g);
  } else if (biome === 'desert') {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 90;
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    const g = audioCtx.createGain(); g.gain.value = 0.05;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.3;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 30;
    lfo.connect(lfoG); lfoG.connect(o.frequency);
    o.connect(f); f.connect(g); g.connect(masterGain);
    o.start(t); lfo.start(t);
    ambientNodes.push(o, lfo, g);
  } else if (biome === 'mud') {
    // thick low rumble
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 40;

// ============================================================
//  TRACK — closed loop, control polygon + sampled centerline
// ============================================================
function buildTrack(seed) {
  const rng = mulberry32(seed);
  const N = 10;
  const pts = [];
  const baseR = 90;  // base radius
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    const r = baseR * (0.7 + rng() * 0.6);
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  // Catmull-Rom closed
  const samples = 600;
  const track = [];
  for (let i = 0; i < samples; i++) {
    const t = i / samples * N;
    const idx = Math.floor(t) % N;
    const f = t - Math.floor(t);
    const p0 = pts[(idx - 1 + N) % N];
    const p1 = pts[idx];
    const p2 = pts[(idx + 1) % N];
    const p3 = pts[(idx + 2) % N];
    // Catmull-Rom to Bezier
    const t2 = f * f, t3 = t2 * f;
    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * f + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * t3);
    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * f + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * t3);
    track.push({ x, y });
  }
  // Compute length
  let totalLen = 0;
  for (let i = 0; i < track.length; i++) {
    const a = track[i], b = track[(i + 1) % track.length];
    a.s = totalLen;
    totalLen += Math.hypot(b.x - a.x, b.y - a.y);
  }
  track.totalLen = totalLen;
  return track;
}

// ============================================================
//  BIKE
// ============================================================
class Bike {
  constructor() {
    this.x = 0; this.y = 0; this.angle = 0;
    this.vx = 0; this.vy = 0; this.angularV = 0;
    this.wheelR = 0.35;
    this.bodyLen = 1.2;
    this.bodyW = 0.5;
    this.lean = 0;        // visual lean, rad
    this.pitch = 0;       // wheelie/pitch rad
    this.frontWheelY = 0; // suspension offset
    this.rearWheelY = 0;
    this.bikeRoll = 0;    // visual roll
    this.crashed = false;
    this.crashTime = 0;
    this.lastSurface = 'dirt';
  }
  reset(x, y, angle) {
    this.x = x; this.y = y; this.angle = angle;
    this.vx = 0; this.vy = 0; this.angularV = 0;
    this.lean = 0; this.pitch = 0;
    this.frontWheelY = 0; this.rearWheelY = 0;
    this.bikeRoll = 0;
    this.crashed = false; this.crashTime = 0;
  }
  update(dt, surface) {
    if (this.crashed) {
      this.crashTime += dt;
      this.vx *= 0.95; this.vy *= 0.95;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.angle += this.angularV * dt;
      this.angularV *= 0.95;
      if (this.crashTime > 1.2) {
        this.crashed = false;
        this.crashTime = 0;
      }
      return;
    }
    // Surface grip factor
    let grip = 1.0;
    if (surface === 'mud') grip = 0.4;
    else if (surface === 'sand') grip = 0.7;
    else if (surface === 'ice') grip = 0.3;
    // Speed
    const forwardX = Math.cos(this.angle), forwardY = Math.sin(this.angle);
    const rightX = -Math.sin(this.angle), rightY = Math.cos(this.angle);
    const forwardV = this.vx * forwardX + this.vy * forwardY;
    const rightV = this.vx * rightX + this.vy * rightY;
    let newForward = forwardV;
    let newRight = rightV;
    // Throttle
    const topSpeed = 28 * (surface === 'mud' ? 0.6 : (surface === 'sand' ? 0.85 : 1.0));
    if (input.gas) newForward += 22 * dt;
    if (input.brake) newForward -= 28 * dt;
    newForward *= 0.985;  // drag
    newForward = clamp(newForward, -8, topSpeed);
    // Steering
    const steerStrength = (input.leanR ? 1 : 0) - (input.leanL ? 1 : 0);
    // Effective turning depends on speed and grip
    const speedFactor = clamp(Math.abs(newForward) / 4, 0.3, 1.0);
    // Stronger steering input
    this.angularV += steerStrength * 5.5 * speedFactor * grip * dt;
    this.angularV *= 0.88;
    this.angle += this.angularV * dt;
    // Recompute axes after the angle change so velocity decomposes correctly
    // (this is what makes the bike feel like it actually turns —
    // the velocity vector follows the new heading, with the lateral
    // component being the part that was 'sideways' relative to the new heading)
    const fX2 = Math.cos(this.angle), fY2 = Math.sin(this.angle);
    const rX2 = -Math.sin(this.angle), rY2 = Math.cos(this.angle);
    let newF2 = this.vx * fX2 + this.vy * fY2;
    let newR2 = this.vx * rX2 + this.vy * rY2;
    // Apply throttle to new forward direction
    if (input.gas) newF2 += 22 * dt;
    if (input.brake) newF2 -= 28 * dt;
    newF2 *= 0.985;
    newF2 = clamp(newF2, -8, topSpeed);
    // Lateral grip: kill sideways velocity based on grip
    newR2 *= 1 - (1 - grip) * 0.7;  // strong lateral friction
    newR2 *= 0.82;                  // always bleed a little
    // Handbrake
    if (input.hand && Math.abs(newF2) > 2) {
      newF2 *= 0.92;
      newR2 *= 0.5;  // slide more
    }
    // Reconstruct velocity in world coords using the new axes
    this.vx = newF2 * fX2 + newR2 * rX2;
    this.vy = newF2 * fY2 + newR2 * rY2;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // Visual lean: banked turns
    const targetLean = clamp(steerStrength * 0.4 - newR2 * 0.08, -0.6, 0.6);
    this.lean = lerp(this.lean, targetLean, 0.15);
    this.bikeRoll = lerp(this.bikeRoll, -steerStrength * 0.3, 0.1);
    // Pitch: wheelie from throttle
    const targetPitch = input.gas ? -0.15 : (input.brake ? 0.1 : 0);
    this.pitch = lerp(this.pitch, targetPitch, 0.08);
    // Crash check (very rough): if extreme tilt
    if (Math.abs(this.lean) > 1.3 && Math.abs(forwardV) > 6) {
      this.crashed = true;
      this.vx *= 0.3; this.vy *= 0.3;
      this.angularV = (Math.random() - 0.5) * 4;
    }
  }
  speedKmh() {
    return Math.hypot(this.vx, this.vy) * 3.6;
  }
  forwardVec() { return { x: Math.cos(this.angle), y: Math.sin(this.angle) }; }
}

const particles = [];
function emitParticle(x, y, vx, vy, color, life, size, kind) {
  particles.push({ x, y, vx, vy, color, life, max: life, size, kind: kind || 'dot' });
  if (particles.length > 400) particles.shift();
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.vy += 8 * dt;  // gravity
  }
}

// ============================================================
//  PROPS — per-biome prop generation
// ============================================================
function generateProps(biomeKey, biome, track, rng) {
  const props = [];
  const count = Math.floor(track.totalLen * biome.propDensity * 0.7);
  for (let i = 0; i < count; i++) {
    const idx = Math.floor(rng() * track.length);
    const p = track[idx];
    const t = idx / track.length;
    const next = track[(idx + 1) % track.length];
    const tx = next.x - p.x, ty = next.y - p.y;
    const tlen = Math.hypot(tx, ty);
    const nx = tx / tlen, ny = ty / tlen;
    const side = rng() < 0.5 ? -1 : 1;
    const off = 3 + rng() * 6;
    const px = p.x + nx * off * side + (-ny) * off * 0.0;  // perpendicular offset handled by side
    const py = p.y + ny * off * side + (nx) * off * 0.0;
    // Better: offset perpendicular to track
    const px2 = p.x + (-ny) * off * side;
    const py2 = p.y + (nx) * off * side;
    const type = choose(rng, biome.props);
    const rot = rng() * TAU;
    const scale = (0.7 + rng() * 0.8) * (biome.propScale || 1.0);
    props.push({ type, x: px2, y: py2, rot, scale, t });
  }
  return props;
}

// ============================================================
//  RENDER — biome-specific drawing
// ============================================================
function drawSky(ctx, biome, t) {
  // Gradient sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, biome.sky[0]);
  grad.addColorStop(0.5, biome.sky[1]);
  grad.addColorStop(1, biome.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // Sun
  const sunX = W * 0.7;
  const sunY = H * biome.sunY;
  if (biome.ambientName !== 'city') {
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 80);
    sunGrad.addColorStop(0, biome.sun);
    sunGrad.addColorStop(0.4, biome.sun + '88');
    sunGrad.addColorStop(1, biome.sun + '00');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, H);
  }
  // Sun disc
  ctx.fillStyle = biome.sun;
  ctx.beginPath();
  ctx.arc(sunX, sunY, biome.ambientName === 'city' ? 28 : 22, 0, TAU);
  ctx.fill();
  // Far parallax layers (3 layers)
  for (let L = 0; L < 3; L++) {
    drawSkyLayer(ctx, biome, L, t);
  }
}
function drawSkyLayer(ctx, biome, layer, t) {
  const parallax = [0.02, 0.05, 0.1][layer];
  const yBase = H * 0.45 + layer * 40;
  const color = biome.sky[Math.min(layer, biome.sky.length - 1)];
  const dark = layer === 0;
  ctx.fillStyle = dark ? '#0008' : '#0003';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    const wx = (x - state.cam.x * parallax) * 0.01;
    const h = Math.sin(wx + layer) * 30 + Math.cos(wx * 0.7 + layer * 2) * 20;
    ctx.lineTo(x, yBase + h);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawProp(ctx, type, x, y, rot, scale, biomeKey) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale * SCALE, scale * SCALE);
  // 3-tone shading using current sun angle
  // (light direction is fixed, top-left)
  const L = 0.55;  // base lightness
  if (type === 'fern') {
    // Frond: dark green
    ctx.fillStyle = '#1a4a1a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.6, 1.2, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2a6a2a';
    ctx.beginPath();
    ctx.ellipse(0, -0.1, 0.5, 1.0, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3a8a3a';
    ctx.beginPath();
    ctx.ellipse(0, -0.2, 0.35, 0.7, 0, 0, TAU);
    ctx.fill();
  } else if (type === 'tree') {
    // Trunk
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(-0.18, -0.5, 0.36, 2.0);
    ctx.fillStyle = '#2a1808';
    ctx.fillRect(-0.18, 0.5, 0.36, 1.0);
    // Canopy: 3 stacked spheres

      ctx.fillStyle = c;

      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#4a8a4a';
      ctx.beginPath();
      ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.5, 0, TAU);
      ctx.fill();
    });
  } else if (type === 'flower') {
    ctx.fillStyle = '#0a3a0a';
    ctx.fillRect(-0.05, 0, 0.1, 0.5);
    const colors = ['#ff2040', '#ff40a0', '#ffd040', '#ff80d0'];
    const c = colors[Math.floor(rot * 10) % colors.length];
    ctx.fillStyle = c;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;

    }

    ctx.beginPath();
    ctx.arc(0, -0.5, 0.1, 0, TAU);
    ctx.fill();
  } else if (type === 'log') {
    ctx.fillStyle = '#4a2a10';

    ctx.fillStyle = '#3a1a08';
    ctx.fillRect(-1.0, 0.0, 2.0, 0.3);

    ctx.strokeStyle = '#1a3a1a';

    ctx.beginPath();
    ctx.moveTo(0, -1.5);
    for (let i = 0; i < 6; i++) {
      const yy = -1.5 + i * 0.3;
      ctx.lineTo(Math.sin(i + rot) * 0.2, yy);
    }
    ctx.stroke();
  } else if (type === 'mushroom') {
    ctx.fillStyle = '#f0e8d8';
    ctx.fillRect(-0.08, 0, 0.16, 0.3);
    ctx.fillStyle = '#c83020';
    ctx.beginPath();
    ctx.arc(0, -0.05, 0.25, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 4; i++) {

    ctx.beginPath(); ctx.arc(-0.4, 0, 0.08, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0.4, 0, 0.08, 0, TAU); ctx.fill();
  } else if (type === 'post') {
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(-0.1, -1.0, 0.2, 1.5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-0.1, -0.6, 0.2, 0.1);
  } else if (type === 'mudclump') {
    ctx.fillStyle = '#1a0a04';
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.4, 0.2, 0, 0, TAU);
    ctx.fill();
  } else if (type === 'deadtree') {
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-0.1, -1.5, 0.2, 2.0);
    ctx.fillRect(-0.5, -1.2, 0.4, 0.1);
    ctx.fillRect(0.1, -0.8, 0.4, 0.1);
    ctx.fillRect(-0.4, -0.4, 0.3, 0.08);
  } else if (type === 'pine') {
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(-0.1, 0, 0.2, 0.5);
    ctx.fillStyle = '#0a3018';
    ctx.beginPath();
    ctx.moveTo(0, -1.8);
    ctx.lineTo(0.7, -0.4);
    ctx.lineTo(-0.7, -0.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a4828';
    ctx.beginPath();
    ctx.moveTo(0, -1.4);
    ctx.lineTo(0.5, -0.5);
    ctx.lineTo(-0.5, -0.5);
    ctx.closePath();
    ctx.fill();
    if (scale > 1.0) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -1.6);
      ctx.lineTo(0.2, -1.0);
      ctx.lineTo(-0.2, -1.0);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'marker') {
    ctx.fillStyle = '#5a3010';
    ctx.fillRect(-0.05, -1.0, 0.1, 1.3);
    ctx.fillStyle = '#ff4040';
    ctx.fillRect(-0.3, -1.0, 0.6, 0.15);
  } else if (type === 'building') {
    // Boxy building
    const w = 1.5 + Math.abs(Math.sin(rot * 10)) * 1.5;
    const h = 3 + Math.abs(Math.cos(rot * 13)) * 4;
    // dark side
    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(-w, -h, w * 2, h);
    // mid side
    ctx.fillStyle = '#252530';
    ctx.fillRect(-w, -h, w, h);
    // lit windows
    const wW = 0.15, wH = 0.2;
    for (let yy = -h + 0.3; yy < -0.5; yy += 0.4) {
      for (let xx = -w + 0.2; xx < w - 0.2; xx += 0.3) {
        const lit = (Math.sin(xx * 10 + yy * 7 + rot * 5) > -0.3) ? 1 : 0;
        ctx.fillStyle = lit ? '#ffd060' : '#0a0a12';
        ctx.fillRect(xx, yy, wW, wH);
      }
    }
  } else if (type === 'streetlight') {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-0.05, -2.5, 0.1, 2.5);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-0.4, -2.5, 0.5, 0.1);
    // lamp glow
    const g = ctx.createRadialGradient(0, -2.5, 0, 0, -2.5, 1.2);
    g.addColorStop(0, '#ffe080cc');
    g.addColorStop(0.5, '#ffa04044');
    g.addColorStop(1, '#ffa04000');
    ctx.fillStyle = g;
    ctx.fillRect(-2, -4, 4, 2);
    ctx.fillStyle = '#ffe080';
    ctx.beginPath();
    ctx.arc(0, -2.5, 0.1, 0, TAU);
    ctx.fill();
  } else if (type === 'neon') {
    const colors = ['#ff2080', '#20ffff', '#ff8020', '#80ff20', '#ff40ff'];
    const c = colors[Math.floor(rot * 3) % colors.length];
    // glow
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1.5);
    g.addColorStop(0, c + 'cc');
    g.addColorStop(1, c + '00');
    ctx.fillStyle = g;
    ctx.fillRect(-2, -2, 4, 4);
    // sign
    ctx.fillStyle = c;
    ctx.fillRect(-0.6, -0.2, 1.2, 0.4);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(['LOOP', 'GRIND', 'RIDE', 'BIKE', 'OIL'][Math.floor(rot * 7) % 5], 0, 0);
  } else if (type === 'dumpster') {
    ctx.fillStyle = '#1a3a2a';
    ctx.fillRect(-0.7, -0.5, 1.4, 0.6);
    ctx.fillStyle = '#0a1a14';
    ctx.fillRect(-0.7, 0.0, 1.4, 0.1);
    ctx.fillStyle = '#3a4a3a';
    for (let i = -2; i <= 2; i++) ctx.fillRect(i * 0.2, -0.4, 0.05, 0.3);
  } else if (type === 'cone') {
    ctx.fillStyle = '#ff6020';
    ctx.beginPath();
    ctx.moveTo(0, -0.6);
    ctx.lineTo(0.3, 0.2);
    ctx.lineTo(-0.3, 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-0.3, 0.0, 0.6, 0.08);
    ctx.fillRect(-0.3, -0.2, 0.6, 0.06);
  }
  ctx.restore();
}

// ============================================================
//  BIKE DRAW — lime green
// ============================================================
function drawBike(ctx, bike, dt) {
  ctx.save();
  // World-to-screen transform
  const s = worldToScreen(bike.x, bike.y);
  ctx.translate(s.x, s.y);
  ctx.rotate(bike.angle);
  ctx.scale(SCALE, SCALE);
  // Suspension offsets
  const fY = bike.frontWheelY || 0;
  const rY = bike.rearWheelY || 0;
  // Body pivot
  ctx.translate(0, -0.3);
  ctx.rotate(bike.bikeRoll);
  // Rear wheel
  drawWheel(ctx, -0.45, 0.45 + rY, bike.wheelR);
  // Front wheel
  drawWheel(ctx, 0.45, 0.45 + fY, bike.wheelR);
  // Frame (lime green)
  ctx.fillStyle = '#7CFC00';
  ctx.beginPath();
  ctx.moveTo(-0.4, 0.3);
  ctx.lineTo(-0.5, -0.1);
  ctx.lineTo(0.3, -0.2);
  ctx.lineTo(0.5, 0.3);
  ctx.closePath();
  ctx.fill();
  // Tank (brighter lime)
  ctx.fillStyle = '#9EFF1A';
  ctx.beginPath();
  ctx.ellipse(0.0, -0.15, 0.35, 0.22, 0, 0, TAU);
  ctx.fill();
  // Tank highlight
  ctx.fillStyle = '#ccff80';
  ctx.beginPath();
  ctx.ellipse(-0.1, -0.22, 0.15, 0.08, 0, 0, TAU);
  ctx.fill();
  // Engine block
  ctx.fillStyle = '#404048';
  ctx.fillRect(-0.15, 0.05, 0.4, 0.2);
  ctx.fillStyle = '#202028';
  ctx.fillRect(-0.15, 0.15, 0.4, 0.06);
  // Exhaust pipe
  ctx.strokeStyle = '#a0a0a8';
  ctx.lineWidth = 0.07;
  ctx.beginPath();
  ctx.moveTo(-0.4, 0.15);
  ctx.lineTo(-0.7, 0.25);
  ctx.stroke();
  // exhaust glow when throttling
  if (input.gas) {
    ctx.fillStyle = '#ff8020aa';
    ctx.beginPath();
    ctx.arc(-0.78, 0.27, 0.08 + Math.random() * 0.04, 0, TAU);
    ctx.fill();
  }
  // Seat
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(-0.18, -0.28, 0.22, 0.08, 0, 0, TAU);
  ctx.fill();
  // Handlebars
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 0.06;
  ctx.beginPath();
  ctx.moveTo(0.3, -0.3);
  ctx.lineTo(0.45, -0.55);
  ctx.lineTo(0.55, -0.55);
  ctx.moveTo(0.3, -0.3);
  ctx.lineTo(0.45, -0.05);
  ctx.lineTo(0.55, -0.05);
  ctx.stroke();
  // green grip ends
  ctx.fillStyle = '#7CFC00';
  ctx.fillRect(0.5, -0.6, 0.08, 0.08);
  ctx.fillRect(0.5, -0.1, 0.08, 0.08);
  // Front forks
  ctx.strokeStyle = '#7CFC00';
  ctx.lineWidth = 0.08;
  ctx.beginPath();
  ctx.moveTo(0.35, -0.2);
  ctx.lineTo(0.45, 0.45);
  ctx.stroke();
  ctx.strokeStyle = '#d0d0d8';
  ctx.lineWidth = 0.04;
  ctx.beginPath();
  ctx.moveTo(0.4, -0.1);
  ctx.lineTo(0.45, 0.4);
  ctx.stroke();
  // Rider body (black with green visor stripe)
  ctx.fillStyle = '#0a0a0a';
  // torso
  ctx.beginPath();
  ctx.moveTo(-0.3, -0.4);
  ctx.lineTo(0.15, -0.45);
  ctx.lineTo(0.25, -0.1);
  ctx.lineTo(-0.25, -0.1);
  ctx.closePath();
  ctx.fill();
  // helmet
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(0.1, -0.55, 0.18, 0, TAU);
  ctx.fill();
  // green visor
  ctx.fillStyle = '#7CFC00';
  ctx.beginPath();
  ctx.ellipse(0.15, -0.55, 0.13, 0.06, 0, 0, TAU);
  ctx.fill();
  // arm to handlebar
  ctx.strokeStyle = '#0a0a0a';
  ctx.lineWidth = 0.1;
  ctx.beginPath();
  ctx.moveTo(0.05, -0.3);
  ctx.lineTo(0.35, -0.35);
  ctx.stroke();
  // legs
  ctx.strokeStyle = '#0a0a0a';
  ctx.lineWidth = 0.1;
  ctx.beginPath();
  ctx.moveTo(-0.1, -0.1);
  ctx.lineTo(-0.3, 0.4);
  ctx.moveTo(0.1, -0.1);
  ctx.lineTo(0.0, 0.4);
  ctx.stroke();
  // Green rim light (for dark biomes)
  if (state.race && state.biomeKey === 'city') {
    ctx.shadowColor = '#9EFF1A';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#9EFF1A';
    ctx.lineWidth = 0.04;
    ctx.beginPath();
    ctx.moveTo(-0.4, 0.3);
    ctx.lineTo(-0.5, -0.1);
    ctx.lineTo(0.3, -0.2);
    ctx.lineTo(0.5, 0.3);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}
function drawWheel(ctx, x, y, r) {
  // Tire
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  // Tread
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.04;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.stroke();
  }
  // Rim (green)
  ctx.fillStyle = '#7CFC00';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.7, 0, TAU);
  ctx.fill();
  // Inner rim
  ctx.fillStyle = '#404040';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.4, 0, TAU);
  ctx.fill();
  // Hub
  ctx.fillStyle = '#a0a0a0';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.15, 0, TAU);
  ctx.fill();
  // Spokes (visible only on front)
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.02;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r * 0.65, y + Math.sin(a) * r * 0.65);
    ctx.stroke();
  }
}

// ============================================================
//  TERRAIN — render per biome
// ============================================================
function heightAt(biome, wx, wy) {
  // Height field: combo of noise
  const seed = biome.seed;
  const t = biome.terrain;
  const h1 = fbm(wx * t.hillFreq, 4, seed) * 2 - 1;
  const h2 = fbm(wx * t.jumpFreq + wy * 0.1, 3, seed + 99) * 2 - 1;
  const h3 = fbm((wx + wy) * 0.01, 2, seed + 199) * 2 - 1;
  // base dune / hill shape
  let h = h1 * t.amplitude * 0.7;
  // small jumps
  h += h2 * t.amplitude * 0.4 * t.roughness;
  // broad variation
  h += h3 * t.amplitude * 0.3;
  // Mud map pits
  if (biome.ambientName === 'mud') {
    const pit = noise1d(wx * t.mudFreq, seed + 333);
    if (pit > 0.7) h -= 0.5;
  }
  return h;
}
function surfaceAt(biome, wx, wy) {
  if (biome.ambientName === 'mud') {
    const pit = noise1d(wx * biome.terrain.mudFreq, biome.seed + 333);
    if (pit > 0.65) return 'mud';
  }
  if (biome.ambientName === 'desert') return 'sand';
  if (biome.ambientName === 'snow') {
    const ice = noise1d(wx * 0.05 + wy * 0.05, biome.seed + 555);
    if (ice > 0.78) return 'ice';
  }
  return 'dirt';
}
function drawTerrain(ctx, biome, cam) {
  // Tiled terrain patches visible from camera
  const stepX = 8;
  const stepY = 8;
  // Smaller viewport for perf
  const startX = cam.x - W * 0.5 / SCALE;
  const endX = cam.x + W * 0.5 / SCALE;
  const startY = cam.y - H * 0.5 / SCALE;
  const endY = cam.y + H * 0.5 / SCALE;
  // Pre-compute height grid
  const cols = Math.ceil((endX - startX) / stepX) + 2;
  const rows = Math.ceil((endY - startY) / stepY) + 2;
  const heights = new Float32Array(cols * rows);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const wx = startX + c * stepX;
      const wy = startY + r * stepY;
      heights[r * cols + c] = heightAt(biome, wx, wy);
    }
  }
  // Draw triangulated quads with mid-tone color
  const lift = SCALE * 0.6;
  // Light direction: from upper-left (top-left of screen is "sky")
  const lx = -0.5, ly = -0.7;  // unit vector pointing toward light
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const x0 = startX + c * stepX;
      const y0 = startY + r * stepY;
      const h00 = heights[r * cols + c];
      const h10 = heights[r * cols + c + 1];
      const h01 = heights[(r + 1) * cols + c];
      const h11 = heights[(r + 1) * cols + c + 1];
      const s00 = worldToScreen(x0, y0);
      const s10 = worldToScreen(x0 + stepX, y0);
      const s01 = worldToScreen(x0, y0 + stepY);
      const s11 = worldToScreen(x0 + stepX, y0 + stepY);
      const p00y = s00.y - h00 * lift;
      const p10y = s10.y - h10 * lift;
      const p01y = s01.y - h01 * lift;
      const p11y = s11.y - h11 * lift;
      const avg = (h00 + h10 + h01 + h11) / 4;
      const t = (avg + biome.terrain.amplitude) / (biome.terrain.amplitude * 2);
      const n = noise1d(x0 * 0.1 + y0 * 0.1, biome.seed + 17);
      const c1 = pickGroundColor(biome, t + (n - 0.5) * 0.1, x0, y0);
      // Compute slope shading: triangle normal vs light direction
      // Edge 1: p00 -> p10
      const e1x = s10.x - s00.x, e1y = p10y - p00y;
      // Edge 2: p00 -> p01
      const e2x = s01.x - s00.x, e2y = p01y - p00y;
      // Normal: cross product (e1, e2) in 2D gives a normal vector
      const nx = e1y - e2y, ny = -(e1x - e2x);
      const nlen = Math.hypot(nx, ny) || 1;
      const ndotl = (nx / nlen) * lx + (ny / nlen) * ly;
      // Light factor: 0.6 to 1.0
      const lf = clamp(0.75 + ndotl * 0.6, 0.5, 1.15);
      // Apply lighting
      const shaded = shadeColor(c1, lf);
      ctx.fillStyle = shaded;
      // Two triangles per quad
      ctx.beginPath();
      ctx.moveTo(s00.x, p00y);
      ctx.lineTo(s10.x, p10y);
      ctx.lineTo(s11.x, p11y);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(s00.x, p00y);
      ctx.lineTo(s11.x, p11y);
      ctx.lineTo(s01.x, p01y);
      ctx.closePath();
      ctx.fill();
    }
  }
  // Atmospheric fog
  if (biome.fog > 0) {
    ctx.fillStyle = biome.fogColor;
    ctx.globalAlpha = biome.fog;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}
function pickGroundColor(biome, t, x, y) {
  const n = noise1d(x * 0.05 + y * 0.05, biome.seed + 7);
  const idx = Math.floor(t * (biome.ground.length - 0.001));
  const base = biome.ground[clamp(idx, 0, biome.ground.length - 1)];
  // Add accent variation
  if (n > 0.85 && biome.ambientName === 'desert') {
    return biome.groundAccent;
  }
  if (biome.ambientName === 'mud') {
    if (n < 0.2) return biome.groundAccent;
  }
  if (biome.ambientName === 'snow') {
    if (t < 0.3) return biome.groundAccent;
  }
  return base;
}

// ============================================================
//  STATE
// ============================================================
const state = {
  mode: 'title',  // title | mapSelect | countdown | race | paused | finished
  biomeKey: 'rainforest',
  track: null,
  props: [],
  bike: new Bike(),
  t: 0,           // race time in seconds
  finished: false,
  startT: 0,
  countdownT: 0,
  countdownStep: 0,
  bestTimes: {},  // localStorage if available
  cam: { x: 0, y: 0, angle: 0 },
  selectedMap: 0,
  hoveredMap: 0,
  rngSeed: 0
};

// localStorage best times
try {
  const bt = localStorage.getItem('limeRider_bestTimes');
  if (bt) state.bestTimes = JSON.parse(bt);
} catch (e) {}

// ============================================================
//  CANVAS + RENDER LOOP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, SCALE = 32;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SCALE = Math.max(20, Math.min(40, W / 30));
}
window.addEventListener('resize', resize);
resize();

function worldToScreen(wx, wy) {
  return { x: (wx - state.cam.x) * SCALE + W * 0.5, y: (wy - state.cam.y) * SCALE + H * 0.5 };
}
function updateCamera() {
  const b = state.bike;
  // Top-down arcade camera, centered on the bike, no rotation
  // (Bike is drawn in world orientation on top of a top-down world.)
  const targetX = b.x;
  const targetY = b.y;
  // smooth
  state.cam.x = lerp(state.cam.x, targetX, 0.18);
  state.cam.y = lerp(state.cam.y, targetY, 0.18);
  state.cam.angle = lerp(state.cam.angle, b.angle, 0.1);
}

function findClosestTrackPoint(track, x, y) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < track.length; i++) {
    const dx = track[i].x - x, dy = track[i].y - y;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function render() {
  ctx.save();
  // Sky
  const biome = BIOMES[state.biomeKey] || BIOMES.rainforest;
  if (state.mode === 'race' || state.mode === 'paused' || state.mode === 'finished' || state.mode === 'countdown') {
    drawSky(ctx, biome, state.t);
    drawTerrain(ctx, biome, state.cam);
    // Draw props
    for (const p of state.props) {
      const d = Math.hypot(p.x - state.cam.x, p.y - state.cam.y);
      if (d > 50) continue;
      const s = worldToScreen(p.x, p.y);
      // sort by y for depth (already sorted on generation roughly)
      drawProp(ctx, p.type, s.x, s.y, p.rot, p.scale, state.biomeKey);
    }
    // Draw finish line marker
    drawFinishLine(ctx);
    // Draw particles
    drawParticles(ctx);
    // Draw bike
    drawBike(ctx, state.bike, 0);
  } else {
    // Title / select: show preview
    drawSky(ctx, BIOMES.rainforest, 0);
    drawTerrain(ctx, BIOMES.rainforest, state.cam);
  }
  ctx.restore();
}
function drawFinishLine(ctx) {
  if (!state.track) return;
  const p = state.track[0];
  const s = worldToScreen(p.x, p.y);
  // Checkered pattern
  const size = 8;
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 4; j++) {
      ctx.fillStyle = (i + j) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(s.x - 18 + i * 6, s.y - 10 + j * 6, 6, 6);
    }
  }
  // Tall posts
  ctx.fillStyle = '#fff';
  ctx.fillRect(s.x - 18, s.y - 20, 2, 20);
  ctx.fillRect(s.x + 14, s.y - 20, 2, 20);
}
function drawParticles(ctx) {
  for (const p of particles) {
    const alpha = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if (p.kind === 'chunk') {
      ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  RACE LOGIC
// ============================================================
function startRace(biomeKey) {
  state.biomeKey = biomeKey;
  const biome = BIOMES[biomeKey];
  state.track = buildTrack(biome.seed);
  state.rngSeed = biome.seed;
  const rng = mulberry32(biome.seed + 7);
  state.props = generateProps(biomeKey, biome, state.track, rng);
  // Place bike at start, on track
  const sp = state.track[0];
  const next = state.track[1];
  const ang = Math.atan2(next.y - sp.y, next.x - sp.x);
  state.bike.reset(sp.x - Math.cos(ang) * 2, sp.y - Math.sin(ang) * 2, ang);
  state.cam.x = state.bike.x; state.cam.y = state.bike.y; state.cam.angle = ang;
  state.t = 0; state.finished = false;
  state.mode = 'countdown';
  state.countdownT = 0;
  state.countdownStep = 0;
  document.getElementById('title').classList.remove('active');
  document.getElementById('mapSelect').classList.remove('active');
  document.getElementById('pause').classList.remove('active');
  document.getElementById('finished').classList.remove('active');
  document.getElementById('hud').style.display = 'block';
  document.getElementById('countdown').classList.add('active');
  document.getElementById('countdown').textContent = '3';
  document.querySelector('.hud-mini .biome').textContent = biome.name;
  startAmbient(biomeKey);
  initAudio();
  drawMiniMap();
}
function drawMiniMap() {
  const c = document.querySelector('.hud-mini canvas');
  const cx = c.getContext('2d');
  cx.clearRect(0, 0, 120, 120);
  cx.fillStyle = 'rgba(0,0,0,0.4)';
  cx.fillRect(0, 0, 120, 120);
  if (!state.track) return;
  // Find bounding box
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of state.track) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const pad = 8;
  const w = maxX - minX, h = maxY - minY;
  const scale = Math.min((120 - pad * 2) / w, (120 - pad * 2) / h);
  const ox = (120 - w * scale) / 2, oy = (120 - h * scale) / 2;
  cx.strokeStyle = '#9EFF1A';
  cx.lineWidth = 1.5;
  cx.beginPath();
  for (let i = 0; i <= state.track.length; i++) {
    const p = state.track[i % state.track.length];
    const sx = ox + (p.x - minX) * scale;
    const sy = oy + (p.y - minY) * scale;
    if (i === 0) cx.moveTo(sx, sy);
    else cx.lineTo(sx, sy);
  }
  cx.stroke();
  // Player dot
  const b = state.bike;
  const psx = ox + (b.x - minX) * scale;
  const psy = oy + (b.y - minY) * scale;
  cx.fillStyle = '#fff';
  cx.beginPath();
  cx.arc(psx, psy, 3, 0, TAU);
  cx.fill();
  // Start line marker
  const p0 = state.track[0];
  cx.fillStyle = '#ff4040';
  cx.fillRect(ox + (p0.x - minX) * scale - 2, oy + (p0.y - minY) * scale - 2, 4, 4);
}
function finishRace() {
  state.finished = true;
  state.mode = 'finished';
  const timeStr = formatTime(state.t);
  document.getElementById('finTime').textContent = timeStr;
  const prev = state.bestTimes[state.biomeKey];
  const pbEl = document.getElementById('finPB');
  if (!prev || state.t < prev) {
    state.bestTimes[state.biomeKey] = state.t;
    try { localStorage.setItem('limeRider_bestTimes', JSON.stringify(state.bestTimes)); } catch(e){}
    pbEl.textContent = prev ? `−${formatTime(prev - state.t)} PB!` : 'NEW BEST!';
    pbEl.classList.add('improved');
  } else {
    pbEl.textContent = `Best: ${formatTime(prev)}`;
    pbEl.classList.remove('improved');
  }
  document.getElementById('finished').classList.add('active');
  stopAmbient();
  sfx('finish');
}
function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, '0')}`;
}
function checkFinish() {
  if (!state.track) return;
  const bike = state.bike;
  // Find closest track point
  const idx = findClosestTrackPoint(state.track, bike.x, bike.y);
  // Check if crossed start line
  // (We use lap counter: each time we pass idx=0 with sufficient forward motion, count)
  // Simple: track distance traveled along track
  const totalLen = state.track.totalLen;
  if (state._lastIdx === undefined) state._lastIdx = idx;
  // progress = idx / N
  const progress = idx / state.track.length;
  const lastProg = state._lastIdx / state.track.length;
  if (state._lapStarted === undefined) state._lapStarted = true;
  // Crossed start when last progress > 0.9 and current < 0.1
  if (lastProg > 0.9 && progress < 0.1 && state._lapStarted) {
    state._lapStarted = false;
    // Re-arm after some progress
    setTimeout(() => { state._lapStarted = true; }, 500);
    if (state.t > 3) {  // ignore first 3 seconds
      finishRace();
    }
  }
  state._lastIdx = idx;
  // Update progress bar
  document.querySelector('.hud-progress .bar').style.width = (progress * 100) + '%';
}
function updateHUD() {
  const speed = state.bike.speedKmh();
  document.querySelector('.hud-speed .num').textContent = Math.round(speed);
  document.querySelector('.hud-speed .time').textContent = formatTime(state.t);
  drawMiniMap();
}

// ============================================================
//  MAP SELECT UI
// ============================================================
function buildMapSelect() {
  const track = document.getElementById('carouselTrack');
  track.innerHTML = '';
  BIOME_ORDER.forEach((key, i) => {
    const biome = BIOMES[key];
    const card = document.createElement('div');
    card.className = 'card' + (i === state.selectedMap ? ' focus' : '');
    card.dataset.idx = i;
    const best = state.bestTimes[key];
    const bestStr = best ? formatTime(best) : '—';
    const stars = '★'.repeat(biome.stars) + '☆'.repeat(5 - biome.stars);
    card.innerHTML = `
      <canvas width="240" height="140"></canvas>
      <div class="name">${biome.name}</div>
      <div class="stars">${stars}</div>
      <div class="desc">${biome.desc}</div>
      <div class="best">Best: ${bestStr}</div>
    `;
    card.addEventListener('click', () => {
      state.selectedMap = i;
      startRace(BIOME_ORDER[i]);
    });
    card.addEventListener('mouseenter', () => {
      state.selectedMap = i;
      updateCarouselFocus();
    });
    track.appendChild(card);
    // Render thumbnail
    const c = card.querySelector('canvas');
    drawThumbnail(c, key);
  });
  updateCarouselFocus();
}
function drawThumbnail(canvas, key) {
  const biome = BIOMES[key];
  const c = canvas.getContext('2d');
  const w = canvas.width, hgt = canvas.height;
  // Sky gradient
  const g = c.createLinearGradient(0, 0, 0, hgt);
  g.addColorStop(0, biome.sky[0]);
  g.addColorStop(1, biome.sky[2]);
  c.fillStyle = g;
  c.fillRect(0, 0, w, hgt);
  // Ground/terrain
  const seed = biome.seed;
  const amp = biome.terrain.amplitude;
  for (let x = 0; x < w; x += 4) {
    const t = biome.terrain.hillFreq;
    const h = (fbm(x * t * 0.1, 4, seed) * 2 - 1) * amp * 0.7;
    const t2 = (h + amp) / (amp * 2);
    const idx = clamp(Math.floor(t2 * biome.ground.length), 0, biome.ground.length - 1);
    c.fillStyle = biome.ground[idx];
    const y = hgt * 0.6 - h * 6;
    c.fillRect(x, y, 4, hgt);
  }
  // Sun
  c.fillStyle = biome.sun;
  c.beginPath();
  c.arc(w * 0.75, hgt * 0.3, 12, 0, TAU);
  c.fill();
  // Mini bike silhouette
  c.fillStyle = '#7CFC00';
  c.fillRect(w * 0.3, hgt * 0.7, 24, 6);
  c.beginPath();
  c.arc(w * 0.31, hgt * 0.74, 4, 0, TAU);
  c.arc(w * 0.49, hgt * 0.74, 4, 0, TAU);
  c.fill();
  c.fillStyle = '#000';
  c.beginPath();
  c.arc(w * 0.31, hgt * 0.74, 2, 0, TAU);
  c.arc(w * 0.49, hgt * 0.74, 2, 0, TAU);
  c.fill();
}
function updateCarouselFocus() {
  const cards = document.querySelectorAll('.card');
  cards.forEach((c, i) => {
    c.classList.toggle('focus', i === state.selectedMap);
  });
  // Center the focused card
  const track = document.getElementById('carouselTrack');
  const cardW = 240 + 22;
  const offset = (state.selectedMap - 1) * cardW;
  track.style.transform = `translateX(${-offset}px)`;
}
function moveCarousel(dir) {
  state.selectedMap = clamp(state.selectedMap + dir, 0, BIOME_ORDER.length - 1);
  updateCarouselFocus();
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = performance.now();
let acc = 0;
const PHYS_STEP = 1 / 120;
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  // Countdown
  if (state.mode === 'countdown') {
    state.countdownT += dt;
    if (state.countdownT < 1) {
      document.getElementById('countdown').textContent = '3';
    } else if (state.countdownT < 2) {
      if (state.countdownStep === 1) { sfx('count'); state.countdownStep = 2; }
      document.getElementById('countdown').textContent = '2';
    } else if (state.countdownT < 3) {
      if (state.countdownStep === 2) { sfx('count'); state.countdownStep = 3; }
      document.getElementById('countdown').textContent = '1';
    } else if (state.countdownT < 3.5) {
      if (state.countdownStep === 3) { sfx('count'); state.countdownStep = 4; }
      document.getElementById('countdown').textContent = 'GO!';
    } else {
      document.getElementById('countdown').classList.remove('active');
      state.mode = 'race';
      state.startT = now;
      sfx('go');
    }
  }
  // Race
  if (state.mode === 'race') {
    state.t += dt;
    // Sub-step physics
    acc += dt;
    let steps = 0;
    while (acc >= PHYS_STEP && steps < 8) {
      const surf = surfaceAt(BIOMES[state.biomeKey], state.bike.x, state.bike.y);
      state.bike.update(PHYS_STEP, surf);
      // Particle emission
      const speed = state.bike.speedKmh();
      if (speed > 5) {
        const pName = BIOMES[state.biomeKey].particleName;
        if (pName !== 'none') {
          const interval = pName === 'mud' ? 0.02 : 0.05;
          state._lastEmit = (state._lastEmit || 0) + PHYS_STEP;
          if (state._lastEmit > interval) {
            state._lastEmit = 0;
            const ang = state.bike.angle;
            const rx = state.bike.x - Math.cos(ang) * 0.4;
            const ry = state.bike.y - Math.sin(ang) * 0.4;
            for (let i = 0; i < (pName === 'mud' ? 3 : 1); i++) {
              const sa = ang + (Math.random() - 0.5) * 0.8;
              const sp = 1 + Math.random() * 3;
              emitParticle(rx, ry, Math.cos(sa) * sp, Math.sin(sa) * sp - 2, BIOMES[state.biomeKey].particleColor, 0.5 + Math.random() * 0.5, pName === 'mud' ? 0.12 : 0.08, pName === 'mud' ? 'chunk' : 'dot');
            }
            if (pName === 'mud' && Math.random() < 0.2) sfx('mud');
          }
        }
      }
      acc -= PHYS_STEP;
      steps++;
    }
    updateParticles(dt);
    updateCamera();
    // Terrain collision (simple): clamp y to height at bike x
    const biome = BIOMES[state.biomeKey];
    const h = heightAt(biome, state.bike.x, state.bike.y);
    if (state.bike.y < h) {
      state.bike.y = h;
      state.bike.vy = Math.max(0, state.bike.vy);
    }
    // Off-track check (NaN guard)
    if (!isFinite(state.bike.x) || !isFinite(state.bike.y)) {
      const sp = state.track[0];
      const next = state.track[1];
      const ang = Math.atan2(next.y - sp.y, next.x - sp.x);
      state.bike.reset(sp.x, sp.y, ang);
    }
    checkFinish();
    updateHUD();
  }
  // Paused / finished: no physics, but keep rendering
  render();
  // Reset input flags (consume one-shots)
  if (input.pause) input.pause = false;
  if (input.enter) input.enter = false;
  if (input.left) input.left = false;
  if (input.right) input.right = false;
  if (input.up) input.up = false;
  if (input.down) input.down = false;
  if (input.reset) { input.reset = false; if (state.mode === 'race' || state.mode === 'paused' || state.mode === 'countdown') { startRace(state.biomeKey); } }
  if (input.menu) { input.menu = false; if (state.mode === 'race' || state.mode === 'paused' || state.mode === 'finished') { goToMapSelect(); } }
  requestAnimationFrame(loop);
}
function goToMapSelect() {
  state.mode = 'mapSelect';
  stopAmbient();
  document.getElementById('title').classList.remove('active');
  document.getElementById('pause').classList.remove('active');
  document.getElementById('finished').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('mapSelect').classList.add('active');
  buildMapSelect();
}
function goToTitle() {
  state.mode = 'title';
  stopAmbient();
  document.getElementById('mapSelect').classList.remove('active');
  document.getElementById('pause').classList.remove('active');
  document.getElementById('finished').classList.remove('active');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('title').classList.add('active');
}
function togglePause() {
  if (state.mode === 'race') {
    state.mode = 'paused';
    document.getElementById('pause').classList.add('active');
  } else if (state.mode === 'paused') {
    state.mode = 'race';
    document.getElementById('pause').classList.remove('active');
  }
}

// ============================================================
//  UI BINDINGS
// ============================================================
document.getElementById('btnPlay').addEventListener('click', () => goToMapSelect());
document.getElementById('btnMaps').addEventListener('click', () => goToMapSelect());
document.getElementById('btnBack').addEventListener('click', () => goToTitle());
document.getElementById('navPrev').addEventListener('click', () => moveCarousel(-1));
document.getElementById('navNext').addEventListener('click', () => moveCarousel(1));
document.getElementById('btnResume').addEventListener('click', () => togglePause());
document.getElementById('btnRestart').addEventListener('click', () => startRace(state.biomeKey));
document.getElementById('btnQuit').addEventListener('click', () => goToMapSelect());
document.getElementById('btnRetry').addEventListener('click', () => startRace(state.biomeKey));
document.getElementById('btnChangeMap').addEventListener('click', () => goToMapSelect());
document.getElementById('btnTitle').addEventListener('click', () => goToTitle());

// Carousel mouse parallax tilt
document.addEventListener('mousemove', e => {
  if (state.mode === 'mapSelect') {
    const cards = document.querySelectorAll('.card');
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = (e.clientX - cx) / r.width;
      const dy = (e.clientY - cy) / r.height;
      c.style.transform = c.classList.contains('focus')
        ? `scale(1.06) translateY(-4px) rotateY(${dx * 8}deg) rotateX(${-dy * 8}deg)`
        : `rotateY(${dx * 4}deg) rotateX(${-dy * 4}deg)`;
    });
  }
});
document.addEventListener('mouseleave', () => {
  if (state.mode === 'mapSelect') {
    document.querySelectorAll('.card').forEach(c => {
      c.style.transform = '';
    });
  }
});

// Keyboard nav in map select
window.addEventListener('keydown', e => {
  if (state.mode === 'mapSelect') {
    if (e.code === 'ArrowLeft') { moveCarousel(-1); e.preventDefault(); }
    if (e.code === 'ArrowRight') { moveCarousel(1); e.preventDefault(); }
    if (e.code === 'Enter' || e.code === 'Space') { startRace(BIOME_ORDER[state.selectedMap]); e.preventDefault(); }
    if (e.code === 'Escape') { goToTitle(); e.preventDefault(); }
  } else if (state.mode === 'race') {
    if (e.code === 'Escape') { togglePause(); e.preventDefault(); }
  } else if (state.mode === 'paused') {
    if (e.code === 'Escape') { togglePause(); e.preventDefault(); }
  } else if (state.mode === 'title') {
    if (e.code === 'Enter' || e.code === 'Space') { goToMapSelect(); e.preventDefault(); }
  }
});

// First user gesture unlocks audio
window.addEventListener('click', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

// ============================================================
//  BOOT
// ============================================================
requestAnimationFrame(loop);

// Expose for testing / debugging
window.startRace = startRace;
window.goToMapSelect = goToMapSelect;
window.goToTitle = goToTitle;
window.togglePause = togglePause;
window.state = state;
</script>
</body>
