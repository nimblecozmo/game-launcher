<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario-lite Platformer</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #controls div {
            margin-bottom: 0;
        }

        #controls label {
            display: inline-block;
            margin-right: 5px;
            width: auto;
        }

        #controls input[type="range"] {
            width: 80px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="ui-layer">
            Coins: <span id="coin-count">0</span> | <span id="level-display">Level: 1</span>
        </div>
        <div id="controls">
            <div>
                <label>Gravity:</label>
                <input type="range" id="gravity" min="0.005" max="0.05" step="0.001" value="0.02">
            </div>
            <div>
                <label>Wind Speed:</label>
                <input type="range" id="wind-speed" min="0" max="0.1" step="0.005" value="0">
            </div>
            <div>
                <label>Wind Dir:</label>
                <button id="wind-dir">Right >></button>
            </div>
            <div>
                <label>Jump Height:</label>
                <input type="range" id="jump-height" min="0.3" max="1.0" step="0.05" value="0.6">
            </div>
        </div>
    </div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Constants ---
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 400;
        const DEFAULT_GRAVITY = 0.02;
        const DEFAULT_JUMP_FORCE = 0.6;
        const MOVE_SPEED = 0.15;
        const TERMINAL_VELOCITY = 0.8;

        const physics = {
            gravity: DEFAULT_GRAVITY,
            jumpForce: DEFAULT_JUMP_FORCE,
            windSpeed: 0,
            windDirection: 1 // 1 for right, -1 for left
        };

        // --- Global State ---
        const state = {
            coins: 0,
            gameOver: false,
            platforms: [],
            currentLevel: 1,
            maxLevels: 11
        };

        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        // --- Scene Setup ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky Blue

        // Orthographic camera for 2D platformer feel
        // View size: 20 units vertical
        const aspect = CANVAS_WIDTH / CANVAS_HEIGHT;
        const viewSize = 20;
        const camera = new THREE.OrthographicCamera(
            -viewSize * aspect / 2,
            viewSize * aspect / 2,
            viewSize / 2,
            -viewSize / 2,
            0.1,
            1000
        );
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(CANVAS_WIDTH, CANVAS_HEIGHT);
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- Classes ---
        class Box {
            constructor({ width, height, color, x, y, z = 0 }) {
                this.width = width;
                this.height = height;
                this.geometry = new THREE.BoxGeometry(width, height, 1);
                this.material = new THREE.MeshStandardMaterial({ color });
                this.mesh = new THREE.Mesh(this.geometry, this.material);
                this.mesh.position.set(x, y, z);

                // Physics
                this.velocity = { x: 0, y: 0 };
                this.grounded = false;

                scene.add(this.mesh);
            }

            get bottom() { return this.mesh.position.y - this.height / 2; }
            get top() { return this.mesh.position.y + this.height / 2; }
            get left() { return this.mesh.position.x - this.width / 2; }
            get right() { return this.mesh.position.x + this.width / 2; }

            update() { }
        }

        class Player extends Box {
            constructor() {
                super({ width: 1, height: 1, color: 0xff0000, x: 0, y: 0 });
            }

            update(platforms) {
                // Horizontal Movement
                this.velocity.x = 0;
                if (keys.ArrowLeft) this.velocity.x = -MOVE_SPEED;
                if (keys.ArrowRight) this.velocity.x = MOVE_SPEED;

                // Apply Wind
                this.velocity.x += physics.windSpeed * physics.windDirection;

                this.mesh.position.x += this.velocity.x;

                // Apply Gravity
                this.velocity.y -= physics.gravity;
                if (this.velocity.y < -TERMINAL_VELOCITY) this.velocity.y = -TERMINAL_VELOCITY;
                this.mesh.position.y += this.velocity.y;

                // Collision Detection
                this.grounded = false;
                for (const platform of platforms) {
                    if (checkCollision(this, platform)) {
                        // Vertical Collision
                        if (this.velocity.y < 0 &&
                            this.bottom < platform.top &&
                            this.bottom > platform.bottom && // Ensure we are mostly above
                            this.mesh.position.y > platform.mesh.position.y // Double check center
                        ) {
                            this.mesh.position.y = platform.top + this.height / 2;
                            this.velocity.y = 0;
                            this.grounded = true;
                        }
                    }
                }

                // Jump
                if (keys.Space && this.grounded) {
                    this.velocity.y = physics.jumpForce;
                    this.grounded = false;
                }

                // Fall off world reset
                if (this.mesh.position.y < -15) {
                    this.reset();
                }
            }

            reset() {
                this.mesh.position.set(0, 0, 0);
                this.velocity = { x: 0, y: 0 };
            }
        }

        class Platform extends Box {
            constructor({ width, height, x, y, isGround = false }) {
                super({ width, height, color: 0x00ff00, x, y });
                this.baseY = y;
                this.isGround = isGround;
            }
        }

        class Enemy extends Box {
            constructor({ x, y, range = 3 }) {
                super({ width: 1, height: 1, color: 0x0000ff, x, y });
                this.startX = x;
                this.range = range;
                this.speed = 0.05;
                this.direction = 1;
            }

            update() {
                this.mesh.position.x += this.speed * this.direction;

                // Patrol Logic
                if (this.mesh.position.x > this.startX + this.range) {
                    this.direction = -1;
                } else if (this.mesh.position.x < this.startX - this.range) {
                    this.direction = 1;
                }
            }
        }

        class Coin extends Box {
            constructor({ x, y }) {
                super({ width: 0.5, height: 0.5, color: 0xffff00, x, y });
                this.originalY = y;
                this.offset = Math.random() * Math.PI * 2;
            }

            update() {
                // Bobbing animation
                this.mesh.position.y = this.originalY + Math.sin(Date.now() * 0.005 + this.offset) * 0.2;
                this.mesh.rotation.y += 0.05;
            }
        }

        class Flag extends Box {
            constructor({ x, y }) {
                super({ width: 0.5, height: 4, color: 0xffffff, x, y: y + 1.5 });
                // Flag pole
                // Add a flag part
                const flagGeo = new THREE.BoxGeometry(1, 1, 0.1);
                const flagMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const flagMesh = new THREE.Mesh(flagGeo, flagMat);
                flagMesh.position.set(0.5, 1.5, 0);
                this.mesh.add(flagMesh);
            }
        }

        // --- Level Management ---
        function clearLevel() {
            // Remove platforms
            for (const platform of state.platforms) {
                scene.remove(platform.mesh);
            }
            state.platforms = [];

            // Remove enemies
            if (state.enemies) {
                for (const enemy of state.enemies) {
                    scene.remove(enemy.mesh);
                }
            }
            state.enemies = [];

            // Remove coins
            if (state.coinsList) {
                for (const coin of state.coinsList) {
                    scene.remove(coin.mesh);
                }
            }
            state.coinsList = [];

            // Remove flag
            if (state.winFlag) {
                scene.remove(state.winFlag.mesh);
                state.winFlag = null;
            }

            // Remove background
            if (state.backgroundMesh) {
                scene.remove(state.backgroundMesh);
                state.backgroundMesh = null;
            }
        }

        function createVoxelBackground(length) {
            const voxelSize = 0.8;
            const count = 4000; // Total max voxels
            const geometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff }); // Color will be set per instance
            const mesh = new THREE.InstancedMesh(geometry, material, count);

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            let index = 0;

            // Palette
            const greens = [0x228B22, 0x006400, 0x32CD32, 0x90EE90, 0x008000];
            const browns = [0x8B4513, 0xA0522D, 0xCD853F];

            // Ground Layer (Background)
            for (let x = -20; x < length + 20; x += 1) {
                // Base ground
                for (let y = -10; y < -4; y += 1) {
                    if (Math.random() > 0.3 && index < count) {
                        dummy.position.set(x, y, -5 - Math.random() * 5);
                        dummy.rotation.set(Math.random() * 0.2, Math.random() * 0.2, Math.random() * 0.2);
                        dummy.updateMatrix();
                        mesh.setMatrixAt(index, dummy.matrix);

                        // Random brown/dark green
                        const c = Math.random() > 0.5 ? browns[Math.floor(Math.random() * browns.length)] : greens[1];
                        mesh.setColorAt(index, color.setHex(c));
                        index++;
                    }
                }

                // Trees
                if (Math.random() < 0.15 && index < count - 50) {
                    const treeX = x;
                    const treeZ = -5 - Math.random() * 3;
                    const height = 5 + Math.random() * 8;

                    // Trunk
                    for (let h = 0; h < height; h++) {
                        if (index < count) {
                            dummy.position.set(treeX, -4 + h, treeZ);
                            dummy.updateMatrix();
                            mesh.setMatrixAt(index, dummy.matrix);
                            mesh.setColorAt(index, color.setHex(browns[0]));
                            index++;
                        }
                    }

                    // Leaves
                    for (let lx = -2; lx <= 2; lx++) {
                        for (let ly = -2; ly <= 2; ly++) {
                            for (let lz = -2; lz <= 2; lz++) {
                                if (Math.random() > 0.4 && index < count) {
                                    dummy.position.set(treeX + lx * 0.6, -4 + height + ly * 0.6, treeZ + lz * 0.6);
                                    dummy.updateMatrix();
                                    mesh.setMatrixAt(index, dummy.matrix);
                                    mesh.setColorAt(index, color.setHex(greens[Math.floor(Math.random() * greens.length)]));
                                    index++;
                                }
                            }
                        }
                    }
                }
            }

            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
            scene.add(mesh);
            state.backgroundMesh = mesh;
        }

        function loadLevel(level) {
            clearLevel();
            state.currentLevel = level;
            document.getElementById('level-display').innerText = `Level: ${level}`;

            // Reset Player
            player.reset();
            player.mesh.position.set(-15, 0, 0);

            // --- Level Generation ---
            // Triple length: Flag at x = 135 (approx 3x original 45)
            const levelLength = 135;

            // Generate Background
            createVoxelBackground(levelLength);

            // Ground
            // Extend ground to cover the full length
            state.platforms.push(new Platform({ width: 200, height: 2, x: 70, y: -6, isGround: true }));

            // Procedural Generation based on level index
            // We want 11 levels, each slightly harder or different
            const seed = level * 100;

            // Generate Platforms
            // Density increases with level?
            const platformCount = 15 + level;
            for (let i = 0; i < platformCount; i++) {
                const x = -5 + (levelLength / platformCount) * i + (Math.random() * 5);
                const y = -2 + Math.random() * 6;
                const width = 4 + Math.random() * 4;
                state.platforms.push(new Platform({ width, height: 1, x, y }));
            }

            // Generate Enemies
            state.enemies = [];
            const enemyCount = 5 + level;
            for (let i = 0; i < enemyCount; i++) {
                const x = 10 + (levelLength / enemyCount) * i + (Math.random() * 5);
                const y = -2 + Math.random() * 5; // Can be on ground or platforms
                // Snap to nearest platform or ground? 
                // For simplicity, let's put them on the ground or ensure they have a platform
                // A simple approach: put them on the ground for now, or use a fixed y range
                state.enemies.push(new Enemy({ x, y: 1, range: 3 + Math.random() * 2 }));
            }

            // Generate Coins
            state.coinsList = [];
            const coinCount = 20;
            for (let i = 0; i < coinCount; i++) {
                const x = (levelLength / coinCount) * i;
                const y = 0 + Math.random() * 5;
                state.coinsList.push(new Coin({ x, y }));
            }

            // Win Flag
            state.winFlag = new Flag({ x: levelLength, y: -5 });
        }

        function nextLevel() {
            if (state.currentLevel < state.maxLevels) {
                loadLevel(state.currentLevel + 1);
            } else {
                alert('You Win! All levels completed. Coins: ' + state.coins);
                state.coins = 0;
                document.getElementById('coin-count').innerText = state.coins;
                loadLevel(1);
            }
        }

        // --- Game Objects ---
        const player = new Player();
        // Initial Load
        // We need to wait for the DOM to be ready or just call it here
        // But we need to add UI for level display first


        // --- Utils ---
        function checkCollision(box1, box2) {
            const xCollision = box1.right >= box2.left && box1.left <= box2.right;
            const yCollision = box1.bottom + box1.velocity.y <= box2.top && box1.top >= box2.bottom;
            return xCollision && yCollision;
        }

        function checkOverlap(box1, box2) {
            return (
                box1.right >= box2.left &&
                box1.left <= box2.right &&
                box1.top >= box2.bottom &&
                box1.bottom <= box2.top
            );
        }

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') keys.Space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // --- UI Controls ---
        document.getElementById('gravity').addEventListener('input', (e) => {
            physics.gravity = parseFloat(e.target.value);
        });

        document.getElementById('wind-speed').addEventListener('input', (e) => {
            physics.windSpeed = parseFloat(e.target.value);
        });

        document.getElementById('wind-dir').addEventListener('click', (e) => {
            physics.windDirection *= -1;
            e.target.innerText = physics.windDirection === 1 ? 'Right >>' : '<< Left';
        });

        document.getElementById('jump-height').addEventListener('input', (e) => {
            physics.jumpForce = parseFloat(e.target.value);
            updatePlatformHeights();
        });

        function updatePlatformHeights() {
            // Scale factor relative to default jump force
            // If jump force is 0.3 (half of 0.6), we want platforms to be lower.
            // We scale the height relative to the ground (approx -6).
            // Actually, simpler: just scale the Y position if it's a floating platform.

            const scale = physics.jumpForce / DEFAULT_JUMP_FORCE;

            for (const platform of state.platforms) {
                if (!platform.isGround) {
                    // We assume floating platforms are above y=-2 usually.
                    // If we just multiply baseY by scale, a platform at y=2 becomes y=1.
                    // A platform at y=-2 becomes y=-1 (higher!).
                    // We want them to get closer to the ground level (-6).

                    // Let's define ground level
                    const groundY = -6;
                    const heightAboveGround = platform.baseY - groundY;
                    const newHeightAboveGround = heightAboveGround * scale;
                    platform.mesh.position.y = groundY + newHeightAboveGround;
                }
            }
        }

        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (!state.gameOver) {
                update();
            }

            renderer.render(scene, camera);
        }

        function update() {
            player.update(state.platforms);

            // Enemies
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const enemy = state.enemies[i];
                enemy.update();

                // Collision with Player
                if (checkCollision(player, enemy)) {
                    // Check if player landed on top
                    const isStomp = player.velocity.y < 0 && player.bottom > enemy.mesh.position.y;

                    if (isStomp) {
                        // Kill Enemy
                        scene.remove(enemy.mesh);
                        state.enemies.splice(i, 1);
                        player.velocity.y = physics.jumpForce / 2; // Bounce

                        // Add score (optional, using coins for now)
                        state.coins += 10;
                        document.getElementById('coin-count').innerText = state.coins;
                    } else {
                        // Kill Player
                        player.reset();
                        player.mesh.position.set(-15, 0, 0);
                        // Flash screen red
                        document.body.style.backgroundColor = '#500';
                        setTimeout(() => {
                            document.body.style.backgroundColor = '#111';
                        }, 100);
                    }
                }
            }

            // Coins
            for (let i = state.coinsList.length - 1; i >= 0; i--) {
                const coin = state.coinsList[i];
                coin.update();

                if (checkOverlap(player, coin)) {
                    scene.remove(coin.mesh);
                    state.coinsList.splice(i, 1);
                    state.coins++;
                    document.getElementById('coin-count').innerText = state.coins;
                }
            }

            // Win Condition
            if (state.winFlag && checkOverlap(player, state.winFlag)) {
                alert('Level ' + state.currentLevel + ' Complete!');
                player.reset();
                player.mesh.position.set(-15, 0, 0);
                state.coins = 0;
                document.getElementById('coin-count').innerText = state.coins;
                // Respawn coins (simplified: reload page or just leave empty)
                nextLevel();
            }

            // Camera Follow
            // Smoothly interpolate camera position to player position
            const targetX = player.mesh.position.x;
            const targetY = player.mesh.position.y;
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.y += (targetY - camera.position.y) * 0.1;
        }

        loadLevel(1);
        animate();
    </script>
</body>

</html>
