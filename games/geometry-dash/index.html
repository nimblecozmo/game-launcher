<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        h1 {
            color: #fff;
            font-size: 3rem;
            text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        #gameContainer {
            position: relative;
            width: 1200px;
            height: 600px;
            background: linear-gradient(to bottom, #0f0f23 0%, #1a1a3e 100%);
            border: 4px solid #e94560;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        
        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border-radius: 4px;
            left: 150px;
            bottom: 80px;
            transition: transform 0.1s ease, border-radius 0.1s ease;
            box-shadow: 0 0 15px #00ff88;
        }
        
        /* Character shapes */
        #player.square {
            border-radius: 4px;
        }
        
        #player.circle {
            border-radius: 50%;
        }
        
        #player.triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border-radius: 0;
        }
        
        #player.diamond {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border-radius: 0;
        }
        
        #player.hexagon {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            border-radius: 0;
        }
        
        #player.star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            border-radius: 0;
        }
        
        #player.pentagon {
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            border-radius: 0;
        }
        
        #player.octagon {
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            border-radius: 0;
        }
        
        #player.cross {
            clip-path: polygon(25% 0%, 75% 0%, 75% 25%, 100% 25%, 100% 75%, 75% 75%, 75% 100%, 25% 100%, 25% 75%, 0% 75%, 0% 25%, 25% 25%);
            border-radius: 0;
        }
        
        #player.heart {
            clip-path: polygon(50% 100%, 0% 35%, 15% 0%, 50% 30%, 85% 0%, 100% 35%);
            border-radius: 0;
        }
        
        #player.jumping {
            transform: rotate(90deg);
        }
        
        #player.dead {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%) !important;
            box-shadow: 0 0 15px #ff4444;
        }
        
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, #3a3a5c 0%, #2a2a4c 100%);
            border-top: 4px solid #e94560;
        }
        
        .obstacle {
            position: absolute;
            bottom: 80px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            border-radius: 4px 4px 0 0;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }
        
        .spike {
            width: 40px;
            height: 50px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        
        .block {
            width: 50px;
            height: 50px;
        }
        
        .block.tall {
            height: 100px;
        }
        
        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 1.5rem;
            z-index: 10;
        }
        
        #score span {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }
        
        #settingsBtn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        #settingsWrapper {
            width: 1200px;
            display: none;
            margin-top: 10px;
        }
        
        #settingsWrapper.show {
            display: block;
        }
        
        #settingsPanel {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            background: rgba(20, 20, 40, 0.98);
            border: 4px solid #e94560;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        #settingsPanel.show {
            display: flex;
        }
        
        .tab-bar {
            display: flex;
            background: #1a1a2e;
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: #1a1a2e;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }
        
        .tab-content {
            display: none;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        
        .tab-content.active {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-content: flex-start;
        }
        
        .char-option {
            width: 80px;
            height: 80px;
            background: #2a2a4c;
            border: 3px solid #444;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .char-option:hover {
            border-color: #666;
        }
        
        .char-option.selected {
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        
        .char-option div {
            width: 40px;
            height: 40px;
            background: #00ff88;
        }
        
        .char-option div.circle { border-radius: 50%; }
        .char-option div.triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .char-option div.diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .char-option div.hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .char-option div.star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .char-option div.pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
        .char-option div.octagon { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
        .char-option div.cross { clip-path: polygon(25% 0%, 75% 0%, 75% 25%, 100% 25%, 100% 75%, 75% 75%, 75% 100%, 25% 100%, 25% 75%, 0% 75%, 0% 25%, 25% 25%); }
        .char-option div.heart { clip-path: polygon(50% 100%, 0% 35%, 15% 0%, 50% 30%, 85% 0%, 100% 35%); }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 10px;
            width: 100%;
        }
        
        .color-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .color-option:hover {
            transform: scale(1.1);
        }
        
        .color-option.selected {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        #colorPicker {
            width: 100%;
            height: 50px;
            border: none;
            cursor: pointer;
        }
        
        .color-picker-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        
        .color-picker-section label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .hidden {
            display: none !important;
        }
        
        #startScreen h2, #gameOverScreen h2 {
            color: #e94560;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        #startScreen p, #gameOverScreen p {
            color: #aaa;
            margin-bottom: 30px;
        }
        
        button.btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #c73659 100%);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        button.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.7);
        }
        
        #instructions {
            color: #666;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
        }
        
        @keyframes particleFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }
    </style>
<style id="mobile-fix">
html,body{max-width:100%;overflow-x:hidden;}
#game-container,#gameWrapper,.game-container,main{max-width:100%!important;}
</style>
</head>
<body>
    <h1>GEOMETRY DASH</h1>
    <div id="gameContainer">
        <div id="player" class="square"></div>
        <div class="ground"></div>
        <div id="score">Score: <span>0</span></div>
    </div>
    
    <button id="settingsBtn" onclick="toggleSettings()">⚙ Settings</button>
    
    <div id="settingsWrapper">
        <div id="settingsPanel">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('characters')">Characters</button>
                <button class="tab-btn" onclick="switchTab('colors')">Colors</button>
            </div>
            
            <div id="tab-characters" class="tab-content active">
                <div class="char-option selected" onclick="selectCharacter('square', this)">
                    <div class="square"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('circle', this)">
                    <div class="circle"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('triangle', this)">
                    <div class="triangle"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('diamond', this)">
                    <div class="diamond"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('hexagon', this)">
                    <div class="hexagon"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('star', this)">
                    <div class="star"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('pentagon', this)">
                    <div class="pentagon"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('octagon', this)">
                    <div class="octagon"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('cross', this)">
                    <div class="cross"></div>
                </div>
                <div class="char-option" onclick="selectCharacter('heart', this)">
                    <div class="heart"></div>
                </div>
            </div>
            
            <div id="tab-colors" class="tab-content">
                <div class="color-picker-section">
                    <label>Color Wheel (click to pick)</label>
                    <input type="color" id="colorPicker" value="#00ff88" onchange="pickColor(this.value)">
                </div>
                <br>
                <label>Quick Colors</label>
                <div class="color-grid" id="colorGrid"></div>
            </div>
        </div>
        
        <div id="startScreen">
            <h2>READY?</h2>
            <p>Press SPACE or CLICK to jump</p>
            <button class="btn-primary" onclick="startGame()">PLAY</button>
            <p id="instructions">Avoid spikes and blocks!</p>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="btn-primary" onclick="startGame()">RETRY</button>
        </div>
    </div>
    </div>
</div>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.querySelector('#score span');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsWrapper = document.getElementById('settingsWrapper');
        const colorGrid = document.getElementById('colorGrid');
        
        let gameRunning = false;
        let gamePaused = false;
        let playerY = 0;
        let velocityY = 0;
        let isGrounded = true;
        let score = 0;
        let obstacleSpeed = 3;
        let obstacles = [];
        let gravity = -0.8;
        let jumpForce = 15;
        let animationId;
        let spawnTimer = 0;
        let currentChar = 'square';
        let currentColor = '#00ff88';
        
        // Quick colors
        const quickColors = [
            '#00ff88', '#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3',
            '#f38181', '#aa96da', '#fcbad3', '#a8d8ea', '#ff9f43',
            '#5f27cd', '#ff6b6b', '#ee5a5a', '#009432', '#2e86de',
            '#f368e0', '#00d2d3', '#ff9f43', '#5f27cd', '#8395a7'
        ];
        
        quickColors.forEach((color, i) => {
            const div = document.createElement('div');
            div.className = 'color-option';
            div.style.background = color;
            div.onclick = () => pickColor(color, div);
            if (i === 0) div.classList.add('selected');
            colorGrid.appendChild(div);
        });
        
        function toggleSettings() {
            const isShowing = !settingsWrapper.classList.contains('show');
            settingsWrapper.classList.toggle('show');
            settingsPanel.classList.toggle('show');
            if (isShowing && gameRunning) {
                cancelAnimationFrame(animationId);
                gamePaused = true;
            } else if (!isShowing && gamePaused) {
                gamePaused = false;
                gameLoop();
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'characters') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-characters').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-colors').classList.add('active');
            }
        }
        
        function selectCharacter(char, el) {
            document.querySelectorAll('.char-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            currentChar = char;
            player.className = char;
            applyPlayerColor();
            settingsWrapper.classList.remove('show');
            settingsPanel.classList.remove('show');
        }
        
        function pickColor(color, el) {
            currentColor = color;
            document.getElementById('colorPicker').value = color;
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
            if (el) el.classList.add('selected');
            applyPlayerColor();
            settingsWrapper.classList.remove('show');
            settingsPanel.classList.remove('show');
            if (gamePaused) {
                gamePaused = false;
                gameLoop();
            }
        }
        
        function applyPlayerColor() {
            const gradient = `linear-gradient(135deg, ${lightenColor(currentColor, 30)} 0%, ${currentColor} 100%)`;
            player.style.background = gradient;
            player.style.boxShadow = `0 0 15px ${currentColor}`;
            document.querySelectorAll('.char-option').forEach(opt => {
                opt.querySelector('div').style.background = currentColor;
            });
        }
        
        function lightenColor(hex, percent) {
            const num = parseInt(hex.slice(1), 16);
            const r = Math.min(255, (num >> 16) + percent);
            const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
            const b = Math.min(255, (num & 0x0000FF) + percent);
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }
        
        function startGame() {
            gameRunning = true;
            score = 0;
            obstacleSpeed = 3;
            playerY = 0;
            velocityY = 0;
            isGrounded = true;
            obstacles = [];
            
            scoreDisplay.textContent = '0';
            player.style.bottom = '80px';
            player.classList.remove('dead');
            
            applyPlayerColor();
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            settingsWrapper.classList.remove('show');
            settingsPanel.classList.remove('show');
            gamePaused = false;
            
            document.querySelectorAll('.obstacle').forEach(o => o.remove());
            
            gameLoop();
        }
        
        function jump() {
            if (!gameRunning) return;
            if (isGrounded) {
                velocityY = jumpForce;
                isGrounded = false;
                player.classList.add('jumping');
                
                if (player.classList.contains('dead')) {
                    player.classList.remove('dead');
                    applyPlayerColor();
                }
            }
        }
        
        function spawnObstacle() {
            const types = ['spike', 'block', 'block'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const obstacle = document.createElement('div');
            obstacle.className = `obstacle ${type}`;
            
            if (type === 'block') {
                const isTall = Math.random() > 0.5;
                obstacle.style.height = isTall ? '80px' : '40px';
            }
            
            obstacle.style.left = '1200px';
            gameContainer.appendChild(obstacle);
            obstacles.push({ element: obstacle, x: 1200, passed: false });
        }
        
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.bottom = y + 'px';
                particle.style.background = currentColor;
                particle.style.animation = `particleFade 0.5s ease-out forwards`;
                gameContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 500);
            }
        }
        
        function checkCollision(obs) {
            const playerRect = player.getBoundingClientRect();
            const obsRect = obs.element.getBoundingClientRect();
            
            const padding = 8;
            return !(
                playerRect.right - padding <= obsRect.left + padding ||
                playerRect.left + padding >= obsRect.right - padding ||
                playerRect.bottom - padding <= obsRect.top + padding
            );
        }
        
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            player.classList.add('dead');
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            velocityY += gravity;
            playerY += velocityY;
            
            if (playerY <= 0) {
                playerY = 0;
                velocityY = 0;
                isGrounded = true;
                player.classList.remove('jumping');
            }
            
            player.style.bottom = (80 + playerY) + 'px';
            
            spawnTimer++;
            if (spawnTimer > 90) {
                spawnObstacle();
                spawnTimer = 0;
            }
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= obstacleSpeed;
                obs.element.style.left = obs.x + 'px';
                
                if (obs.x < -50) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                    continue;
                }
                
                if (!obs.passed && obs.x < 80) {
                    score++;
                    scoreDisplay.textContent = score;
                    obs.passed = true;
                    
                    if (score % 10 === 0) {
                        obstacleSpeed += 0.3;
                    }
                }
                
                if (obs.x > 80 && obs.x < 170) {
                    if (checkCollision(obs)) {
                        createParticles(150, 80 + playerY);
                        gameOver();
                        return;
                    }
                }
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        
        gameContainer.addEventListener('click', (e) => {
            if (e.target.id !== 'settingsBtn' && e.target.id !== 'colorPicker' && !e.target.closest('.char-option') && !e.target.closest('.color-option') && !e.target.closest('#settingsPanel')) {
                jump();
            }
        });
        
        applyPlayerColor();
    </script>
</body>
</html>
