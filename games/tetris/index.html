<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>TETRIS <span class="highlight">NEON</span></h1>
        </header>

        <div class="game-wrapper">
            <div class="game-container">
                <canvas id="game-board" width="300" height="600" tabindex="0"></canvas>
                <div id="game-overlay" class="overlay hidden">
                    <div class="overlay-content">
                        <h2 id="overlay-title">PAUSED</h2>
                        <p id="overlay-message">Press 'P' to Resume</p>
                        <button id="start-btn" class="btn">Start Game</button>
                    </div>
                </div>
            </div>

            <aside class="sidebar">
                <button id="sidebar-btn" class="btn">Start Game</button>
                <div class="panel score-panel">
                    <h3>Score</h3>
                    <div class="value" id="score">0</div>
                </div>
                <div class="panel level-panel">
                    <h3>Level</h3>
                    <div class="value" id="level">1</div>
                </div>
                <div class="panel lines-panel">
                    <h3>Lines</h3>
                    <div class="value" id="lines">0</div>
                </div>
                <div class="panel next-panel">
                    <h3>Next</h3>
                    <canvas id="next-piece" width="100" height="100"></canvas>
                </div>

                <div class="controls-info">
                    <p><span>← →</span> Move</p>
                    <p><span>↑</span> Rotate</p>
                    <p><span>↓</span> Soft Drop</p>
                    <p><span>Space</span> Hard Drop</p>
                    <p><span>P</span> Pause</p>
                </div>
            </aside>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
